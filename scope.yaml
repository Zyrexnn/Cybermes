program: "Cybermes Security Assessment & Bug Bounty"
authorization: "AUTHORIZED"
dynamic_target_override: false

# Define authorized target domains, URLs, or CIDR blocks below.
# By default, only local research sandboxes are in-scope.
# To assess external targets, add them here or define a per-target reports/<target_slug>/scope.yaml.
targets:
  - "127.0.0.0/8"
  - "127.0.0.1"
  - "localhost"
  - "example.com"
  - "*.example.com"

out_of_scope:
  - "*.gov"
  - "*.mil"
  - "*.edu"

scope_rule: "Only explicitly authorized targets defined in targets or per-target scope.yaml are permitted. Out-of-scope targets are strictly prohibited."

testing_accounts:
  - role: "standard_user"
    username: "researcher_user_a"
    token_env: "USER_A_TOKEN"
  - role: "secondary_user"
    username: "researcher_user_b"
    token_env: "USER_B_TOKEN"

allowed:
  reconnaissance: true
  endpoint_discovery: true
  parameter_fuzzing: true
  vulnerability_testing: true
  authenticated_testing: true
  exploit_validation: true
  poc_generation: true
  browser_automation: true

restricted:
  destructive_actions: true
  denial_of_service: true
  persistence_creation: true
  credential_theft: true
  unrelated_target_access: true
  mass_targeting: true
  data_destruction: true
