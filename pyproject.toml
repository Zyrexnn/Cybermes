[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybermes"
version = "2.1.0"
description = "Autonomous Offensive Security, Bug Bounty & Red Teaming Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Zyrexnn" }
]
dependencies = [
    "hermes-agent>=0.1.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "python-telegram-bot>=21.10",
    "playwright>=1.49.0",
    "arjun>=2.2.1",
    "rich>=13.9.4",
    "markdown>=3.7",
    "jinja2>=3.1.5",
    "mcp-server-fetch>=2026.8.0",
]

[project.urls]
Homepage = "https://github.com/Zyrexnn/Cybermes"
Documentation = "https://github.com/Zyrexnn/Cybermes/tree/main/docs"
Repository = "https://github.com/Zyrexnn/Cybermes.git"
Issues = "https://github.com/Zyrexnn/Cybermes/issues"
Discussions = "https://github.com/Zyrexnn/Cybermes/discussions"
