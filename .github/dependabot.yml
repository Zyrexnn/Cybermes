version: 2
updates:
  # Maintain GitHub Actions dependencies (grouped monthly)
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"

  # Maintain Go modules (grouped monthly, pinned against major breaking changes)
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      go-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "go"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maintain Python / Tools Strix dependencies (grouped monthly)
  - package-ecosystem: "uv"
    directory: "/tools/strix"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      strix-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maintain NPM package dependencies (grouped monthly)
  - package-ecosystem: "npm"
    directory: "/npm"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      npm-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maintain Dockerfile base images (monthly)
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "ubuntu"
