version: 2
updates:
  # Maintain GitHub Actions dependencies (grouped monthly)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"

  # Maintain Go modules (grouped monthly)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      go-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "go"

  # Maintain Python / Tools Strix dependencies (grouped monthly)
  - package-ecosystem: "uv"
    directory: "/tools/strix"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      strix-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"

  # Maintain NPM package dependencies (grouped monthly)
  - package-ecosystem: "npm"
    directory: "/npm"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      npm-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"

  # Maintain Dockerfile base images (monthly)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
