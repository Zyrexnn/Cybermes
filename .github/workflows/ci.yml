name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  go-ci:
    name: Go Tests & Binaries Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Go Unit Tests
        run: go test -v -race ./pkg/...

      - name: Verify Go Binaries Compilation
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/smart_pipe ./cmd/smart_pipe
          go build -ldflags="-s -w" -o bin/secret_scan ./cmd/secret_scan
          go build -ldflags="-s -w" -o bin/search_knowledge ./cmd/search_knowledge
          go build -ldflags="-s -w" -o bin/aggregate_reports ./cmd/aggregate_reports
          go build -ldflags="-s -w" -o bin/cybermes-mcp ./cmd/cybermes-mcp

  python-ci:
    name: Python Syntax & Skill Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Script Compilation
        run: |
          python3 -m py_compile tools/doctor.py tools/windows_compat_check.py tools/generate_pdf.py examples/mock_vulnerable_app.py scripts/mcp.py scripts/setup_mcp.py

      - name: Validate Skills Integrity
        run: |
          python3 tools/validate_skills.py

  node-mcp-ci:
    name: Node.js & MCP Package Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run MCP NPM Package Unit Tests
        run: |
          node -c npm/bin/cybermes-mcp.js
          node npm/test.js

  docker-lint:
    name: Dockerfile Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          outputs: type=tar,dest=/dev/null
