name: Cybermes MCP Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output_name: cybermes-mcp-${{ github.ref_name }}-windows-amd64.exe
          - goos: linux
            goarch: amd64
            output_name: cybermes-mcp-${{ github.ref_name }}-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: cybermes-mcp-${{ github.ref_name }}-linux-arm64
          - goos: darwin
            goarch: arm64
            output_name: cybermes-mcp-${{ github.ref_name }}-darwin-arm64
          - goos: darwin
            goarch: amd64
            output_name: cybermes-mcp-${{ github.ref_name }}-darwin-amd64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Compile Cybermes MCP Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -v -trimpath -ldflags="-s -w -X cybermes/pkg/mcp.ServerVersion=${{ github.ref_name }}" -o dist/${{ matrix.output_name }} ./cmd/cybermes-mcp

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          retention-days: 2

  release:
    name: Publish GitHub Release & Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release_assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          generate_release_notes: false
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish NPM Package (cybermes-mcp)
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync NPM Version with Tag
        working-directory: npm
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          echo "Updating npm package version to $TAG_VER"
          npm version "$TAG_VER" --no-git-tag-version --allow-same-version

      - name: Publish to NPM
        working-directory: npm
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
